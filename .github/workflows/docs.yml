name: Docs

on:
  push:
    branches: ["main"]                # deploy on main
    paths:
      - "app/**"
      - "scripts/**"
      - "pdoc.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["main"]                # build on PRs targeting main
    paths:
      - "app/**"
      - "scripts/**"
      - "pdoc.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:                  # allow manual run from Actions tab

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pdoc markdown

      - name: Build API docs (pdoc) + convert Markdown pages
        env:
          PYTHONPATH: ${{ github.workspace }}/app:${{ github.workspace }}
        run: |
          rm -rf app/site
          pdoc app --no-show-source --template-dir app/pdoc_templates -o app/site
          python scripts/build_docs.py
          touch app/site/.nojekyll

      # On PRs / manual runs, attach the site as an artifact so you can preview it
      - name: Upload docs artifact (PR/Manual)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: app/site

      # Only publish when pushing to main
      - name: Publish to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/site
          publish_branch: gh-pages
